<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a68">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turnos">
  <title>Turnos de Intervenciones</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="hdr">
      <button id="prev" class="nav-btn" aria-label="Mes anterior">‹</button>
      <button id="title-btn" class="title-btn">
        <span id="title">Cargando…</span>
        <span class="caret">▾</span>
      </button>
      <button id="next" class="nav-btn" aria-label="Mes siguiente">›</button>
    </header>

    <div id="picker" class="picker hidden">
      <div class="picker-row">
        <select id="month-select" aria-label="Mes"></select>
        <select id="year-select" aria-label="Año"></select>
      </div>
      <button id="today-btn" class="today-btn">Hoy</button>
    </div>

    <div class="weekhdr">
      <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div>
      <div class="we">S</div><div class="we">D</div>
    </div>

    <div id="cal" class="cal"></div>

    <div id="detail" class="detail"></div>

    <div class="footer-actions">
      <button id="menu-btn" class="menu-btn" aria-label="Menú">⋯ Más</button>
    </div>

    <div id="menu" class="menu hidden">
      <button data-action="export">Exportar datos (JSON)</button>
      <button data-action="import">Importar datos (JSON)</button>
      <button data-action="clear">Borrar mes actual</button>
      <button data-action="install" id="install-btn" class="hidden">Instalar app</button>
      <button data-action="close">Cerrar</button>
      <input type="file" id="import-file" accept="application/json" class="hidden">
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(err => {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
