<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a68">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turnos">
  <title>Turnos de Intervenciones</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="hdr">
      <div class="hdr-left">
        <button id="prev" class="nav-btn" aria-label="Anterior">‹</button>
        <button id="title-btn" class="title-btn">
          <span id="title">Cargando…</span>
          <span class="caret">▾</span>
        </button>
        <button id="next" class="nav-btn" aria-label="Siguiente">›</button>
      </div>
      <div class="view-toggle" role="tablist" aria-label="Vista">
        <button data-view="month" class="vt active" role="tab">Mes</button>
        <button data-view="week" class="vt" role="tab">Semana</button>
        <button data-view="day" class="vt" role="tab">Día</button>
      </div>
    </header>

    <div id="picker" class="picker hidden">
      <div class="picker-row">
        <select id="month-select" aria-label="Mes"></select>
        <select id="year-select" aria-label="Año"></select>
      </div>
      <button id="today-btn" class="today-btn">Hoy</button>
    </div>

    <div id="filters" class="filters">
      <select id="filter-person" aria-label="Filtrar por persona"></select>
      <select id="filter-team" aria-label="Filtrar por equipo"></select>
      <button id="clear-filters" class="clear-filters hidden" aria-label="Limpiar filtros">✕</button>
    </div>

    <div class="main-area">
      <div class="primary">
        <div id="view-month" class="view-pane">
          <div class="weekhdr">
            <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div>
            <div class="we">Sáb</div><div class="we">Dom</div>
          </div>
          <div id="cal" class="cal"></div>
        </div>

        <div id="view-week" class="view-pane hidden">
          <div id="week-grid" class="week-grid"></div>
        </div>

        <div id="view-day" class="view-pane hidden">
          <div id="day-view" class="day-view"></div>
        </div>
      </div>

      <div id="detail" class="detail"></div>
    </div>

    <div class="footer-actions">
      <button id="menu-btn" class="menu-btn" aria-label="Menú">⋯ Más</button>
    </div>

    <div id="menu" class="menu hidden">
      <button data-action="generate">🎲 Generar mes</button>
      <button data-action="export">Exportar datos (JSON)</button>
      <button data-action="import">Importar datos (JSON)</button>
      <button data-action="clear">Borrar mes actual</button>
      <button data-action="install" id="install-btn" class="hidden">Instalar app</button>
      <button data-action="close">Cerrar</button>
      <div class="menu-version">Versión <span id="app-version">4</span></div>
      <input type="file" id="import-file" accept="application/json" class="hidden">
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(err => {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
